# ============================================================
# 萌图云 MoePic - Nginx 重写规则示例
# 将以下内容加入 server { ... } 块中,替换 /path/to/moepic 为你的实际路径
# ============================================================

server {
    listen 80;
    server_name your-domain.com;
    root /path/to/moepic;
    index index.php;

    # 图片访问入口(防盗链/访问计数/缩略图按需生成)
    # 原图存在时直接由 Nginx 返回(静态文件优先); 不存在时进入 image.php 处理防盗链/统计/404
    # 与 image.php 注释"仅处理磁盘不存在的请求"保持一致
    location ~ ^/uploads/(.+\.(jpg|jpeg|png|gif|webp))$ {
        try_files /uploads/$1 /image.php?f=$1;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.1-fpm.sock; # 按你的 PHP 版本调整
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 禁止访问敏感文件/目录
    location ~* \.(sql|env|log)$ { deny all; }
    location ~* ^/(config|logs)/ { deny all; }
    location = /config/ { deny all; }

    # 禁止 uploads 目录执行 PHP(防文件上传漏洞)
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
